name: Fix Open VSX pre-release metadata

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "fix" to unpublish and republish the version as pre-release
        required: true
        type: string

jobs:
  fix:
    if: github.event.inputs.confirm == 'fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: openvsx
    permissions:
      contents: read
    env:
      VERSION: 0.1.5-alpha.5
    steps:
      - name: Download published VSIX
        run: |
          set -euo pipefail
          curl -fL -o thinai.vsix \
            "https://open-vsx.org/api/thinai-lang/vscode-thinai/${VERSION}/file/thinai-lang.vscode-thinai-${VERSION}.vsix"
          ls -l thinai.vsix
          sha256sum thinai.vsix

      - name: Unpublish and republish as pre-release
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not configured in the openvsx environment." >&2
            exit 1
          fi
          npx --yes ovsx@1.3.0 unpublish thinai-lang.vscode-thinai \
            --versions "$VERSION" --force -p "$OVSX_PAT"
          npx --yes ovsx@1.3.0 publish thinai.vsix --pre-release -p "$OVSX_PAT"

      - name: Verify channels
        run: |
          set -euo pipefail
          for channel in latest pre-release; do
            echo "--- $channel"
            curl -sL "https://open-vsx.org/api/thinai-lang/vscode-thinai/$channel" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.version, "preRelease="+j.preRelease, JSON.stringify(j.versionAlias));})'
          done
