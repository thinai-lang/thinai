name: Publish extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify tag matches extension version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./packages/extension/package.json').version")
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ($tag_version) does not match extension version ($package_version)." >&2
            exit 1
          fi
      - name: Publish to Visual Studio Marketplace
        working-directory: packages/extension
        run: |
          # Marketplace only accepts major.minor.patch. A semver prerelease tag
          # such as 0.1.0-alpha.1 is published as 0.1.0 with the pre-release flag.
          # vsce validates the manifest before applying a version argument, so the
          # package version has to change first.
          version=$(node -p "require('./package.json').version")
          base=${version%%-*}
          flags=""
          if [ "$base" != "$version" ]; then
            flags="--pre-release"
            npm pkg set version="$base"
          fi
          echo "Publishing $base (from $version) with flags: ${flags:-none}"
          npx @vscode/vsce@4.1.0 publish --oidc --allow-missing-repository $flags
