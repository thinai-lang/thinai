name: Publish extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Visual Studio Marketplace
        working-directory: packages/extension
        run: |
          # Marketplace only accepts major.minor.patch. A semver prerelease tag
          # such as 0.1.0-alpha.1 is published as 0.1.0 with the pre-release flag.
          version=$(node -p "require('./package.json').version")
          base=${version%%-*}
          flags=""
          if [ "$base" != "$version" ]; then
            flags="--pre-release"
          fi
          echo "Publishing $base (from $version) with flags: ${flags:-none}"
          npx @vscode/vsce publish "$base" --oidc $flags
