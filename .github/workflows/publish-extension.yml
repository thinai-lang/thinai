name: Publish extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Visual Studio Marketplace
        working-directory: packages/extension
        run: |
          version=$(node -p "require('./package.json').version")
          flags=""
          case "$version" in
            *-*) flags="--pre-release" ;;
          esac
          echo "Publishing $version with flags: ${flags:-none}"
          npx @vscode/vsce publish --oidc $flags
