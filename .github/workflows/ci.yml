name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Check out public documentation
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@v4
        with:
          repository: thinai-lang/thinai-lang.github.io
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          THINAI_DOCS_REPO: ${{ github.workspace }}/site
      - name: Check public documentation mirrors
        if: matrix.os == 'ubuntu-latest'
        env:
          THINAI_REPO: ${{ github.workspace }}
        run: |
          node site/scripts/sync-examples.mjs --check
          node site/scripts/sync-grammar.mjs --check
          diff -qr .agents/skills/thinai-model site/.agents/skills/thinai-model
      - run: npm pack --dry-run --workspaces
